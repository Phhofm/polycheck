name: CI

on:
  push:
    branches: [main, dev]
    # Docs-only pushes skip the 9x3 test matrix entirely — before this
    # filter, changelog/README/handover commits queued a full matrix per
    # push (2026-11-25: ~20 runs stacked in the queue, several of them
    # docs-only).
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:

# Release commits are pushed to dev AND main — same SHA. Group by SHA so
# the second push cancels the first and the matrix runs once per commit.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 (x64) instead of macos-latest (arm64): the arm64 hosted
        # pool starved repeatedly at 2026-11-23 night — jobs were cancelled
        # without executing a single step. Revisit when capacity recovers.
        os: [ubuntu-latest, macos-13, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/polycheck
      - run: pytest -q -m "not heavy"

  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Dogfood polycheck on itself
        run: polycheck run . --tool ruff --tool mypy --fail-on HIGH
